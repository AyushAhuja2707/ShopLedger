<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>ShopLedger architecture — Stock &amp; cancellation</title><rect width="1200" height="800" fill="#102822"/><g font-family="Segoe UI, sans-serif" fill="#f3faf6"><text x="48" y="62" font-size="34" font-weight="700">ShopLedger / checkout architecture</text><text x="49" y="98" font-size="19" fill="#a4ebc6">Ticket 3 · Stock &amp; cancellation   |   Mint outlines mark ticket scope</text><rect x="48" y="130" width="250" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="60" y="154" font-weight="600" font-size="17">public/</text><text x="60" y="176" font-size="14" fill="#d4e5dd">Browser UI · HTML / CSS / JS</text><rect x="350" y="130" width="250" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="362" y="154" font-weight="600" font-size="17">server.js</text><text x="362" y="176" font-size="14" fill="#d4e5dd">Static UI, API and invoice routes</text><rect x="650" y="130" width="236" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="662" y="154" font-weight="600" font-size="17">config.js</text><text x="662" y="176" font-size="14" fill="#d4e5dd">Shop, coupons, tax slabs, port</text><rect x="908" y="130" width="244" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="920" y="154" font-weight="600" font-size="17">data/db.json</text><text x="920" y="176" font-size="14" fill="#d4e5dd">Shop records via lib/store.js</text><text x="307" y="168" font-size="28">→</text><text x="48" y="233" font-size="19">HTTP routers · mounted at /api</text><rect x="48" y="245" width="265" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="60" y="269" font-weight="600" font-size="17">routes/products.js</text><text x="60" y="291" font-size="14" fill="#d4e5dd">Products and coupons</text><rect x="326" y="245" width="265" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="338" y="269" font-weight="600" font-size="17">routes/orders.js</text><text x="338" y="291" font-size="14" fill="#d4e5dd">Place, list, get and cancel</text><rect x="604" y="245" width="265" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="616" y="269" font-weight="600" font-size="17">routes/customers.js</text><text x="616" y="291" font-size="14" fill="#d4e5dd">Credit accounts and collections</text><rect x="882" y="245" width="265" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="894" y="269" font-weight="600" font-size="17">routes/reports.js</text><text x="894" y="291" font-size="14" fill="#d4e5dd">Reports and pricing preview</text><text x="48" y="352" font-size="19">Business logic · lib/</text><rect x="48" y="366" width="210" height="59" rx="8" fill="#193a32" stroke="#84ffb9" stroke-width="3"/><text x="60" y="390" font-weight="600" font-size="17">inventory.js</text><text x="60" y="412" font-size="14" fill="#d4e5dd">Stock checks and movement</text><rect x="270" y="366" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="282" y="390" font-weight="600" font-size="17">coupons.js</text><text x="282" y="412" font-size="14" fill="#d4e5dd">Eligibility and caps</text><rect x="492" y="366" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="504" y="390" font-weight="600" font-size="17">pricing.js</text><text x="504" y="412" font-size="14" fill="#d4e5dd">Checkout totals</text><rect x="714" y="366" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="726" y="390" font-weight="600" font-size="17">tax.js</text><text x="726" y="412" font-size="14" fill="#d4e5dd">HSN rates and GST split</text><rect x="936" y="366" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="948" y="390" font-weight="600" font-size="17">ledger.js</text><text x="948" y="412" font-size="14" fill="#d4e5dd">Credit and settlements</text><rect x="48" y="440" width="210" height="59" rx="8" fill="#193a32" stroke="#84ffb9" stroke-width="3"/><text x="60" y="464" font-weight="600" font-size="17">orders.js</text><text x="60" y="486" font-size="14" fill="#d4e5dd">Create, list and cancel</text><rect x="270" y="440" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="282" y="464" font-weight="600" font-size="17">dates.js</text><text x="282" y="486" font-size="14" fill="#d4e5dd">Calendar helpers</text><rect x="492" y="440" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="504" y="464" font-weight="600" font-size="17">store.js</text><text x="504" y="486" font-size="14" fill="#d4e5dd">Persist and append audit</text><rect x="714" y="440" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="726" y="464" font-weight="600" font-size="17">invoice.js</text><text x="726" y="486" font-size="14" fill="#d4e5dd">Figures and print view</text><rect x="936" y="440" width="210" height="59" rx="8" fill="#193a32" stroke="#46675e" stroke-width="1"/><text x="948" y="464" font-weight="600" font-size="17">reports.js</text><text x="948" y="486" font-size="14" fill="#d4e5dd">Audit and dashboard</text><text x="48" y="562" font-size="22" font-weight="700">Place an order</text><text x="52" y="600" font-size="18">1   Browser → POST /api/orders → store.read</text><text x="52" y="635" font-size="18">2   inventory.find + inventory.check → coupons.validate</text><text x="52" y="670" font-size="18">3   pricing.computeTotals → coupons.calculateDiscount + tax.getRateForItem</text><text x="52" y="705" font-size="18">4   ledger.chargeOrderToKhata (credit sales only) → inventory.reserve</text><text x="52" y="740" font-size="18">5   orders.add → store.appendAudit → store.write → HTTP 201</text></g></svg>
